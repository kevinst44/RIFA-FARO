services:
  - type: web
    name: rifa-faro-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: RAFFLE_NAME
        sync: false
      - key: EVENT_DATE
        sync: false
      - key: EVENT_TIME
        sync: false
      - key: EVENT_PLACE
        sync: false
      - key: PAYMENT_BANK
        sync: false
      - key: PAYMENT_ACCOUNT_NUMBER
        sync: false
      - key: PAYMENT_ACCOUNT_TYPE
        sync: false
      - key: PAYMENT_OWNER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
